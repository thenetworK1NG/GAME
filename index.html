<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plushie Walk</title>

<!-- Lock the viewport for phones: no zoom, no rubber-band scroll, and
     viewport-fit=cover so the canvas can reach under the notch. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Walk your plushie around a flat field.">

<style>
  :root {
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left, 0px);
    --stick-size:  132px;
    --knob-size:   58px;
    --ui: rgba(255, 255, 255, 0.9);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a2b1f;
    /* Stop iOS from interpreting drags as scroll or pinch-zoom. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    /* inset:0 alone leaves gaps under the notch on some phones. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             var(--safe-bottom) env(safe-area-inset-left);
    display: block;
  }

  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- Joystick ---------- */

  #joystick {
    position: fixed;
    left: calc(var(--safe-left) + 22px);
    bottom: calc(var(--safe-bottom) + 26px);
    width: var(--stick-size);
    height: var(--stick-size);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    touch-action: none;
  }

  /* Faint arrows so the stick reads as directional before you touch it. */
  #joystick::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      linear-gradient(to top,    rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 2px 34% no-repeat,
      linear-gradient(to bottom, rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 2px 34% no-repeat,
      linear-gradient(to left,   rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 34% 2px no-repeat,
      linear-gradient(to right,  rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 34% 2px no-repeat;
    opacity: 0.55;
  }

  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--knob-size);
    height: var(--knob-size);
    margin-left: calc(var(--knob-size) / -2);
    margin-top: calc(var(--knob-size) / -2);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    will-change: transform;
    pointer-events: none;
  }

  /* ---------- Overlays ---------- */

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #1a2b1f;
    color: var(--ui);
    z-index: 20;
    text-align: center;
    padding: 24px;
  }

  #loading .bar {
    width: 170px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }

  #loading .bar span {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: #9ad06f;
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  #loading.hidden { display: none; }

  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px;
    background: #1a2b1f;
    color: #ffb4a2;
    z-index: 30;
    text-align: center;
  }

  #error code {
    display: block;
    max-width: 90vw;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    color: #ffd9cf;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
    text-align: left;
  }

  /* Nudge for orientation when the phone is held sideways. */
  #rotate {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-direction: column;
    background: #1a2b1f;
    color: var(--ui);
    z-index: 40;
    text-align: center;
    padding: 24px;
  }

  #rotate .icon {
    width: 46px;
    height: 74px;
    border: 3px solid var(--ui);
    border-radius: 9px;
    animation: turn 2.4s ease-in-out infinite;
  }

  @keyframes turn {
    0%, 40%   { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }

  /* Portrait phones only: show the hint, but keep it cheap. */
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate { display: flex; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>

<body>
  <div id="stage"></div>

  <div id="joystick" aria-hidden="true">
    <div id="knob"></div>
  </div>

  <div id="loading">
    <div>Waking up the plushie&hellip;</div>
    <div class="bar"><span></span></div>
  </div>

  <div id="error">
    <strong>Something broke</strong>
    <code id="error-text"></code>
  </div>

  <div id="rotate">
    <div class="icon"></div>
    <div>Turn your phone upright</div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
