<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plushie Walk</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS ignores the manifest for the home-screen icon and for standalone
     display, so both need their own tags. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Plushie">

<!-- Lock the viewport for phones: no zoom, no rubber-band scroll, and
     viewport-fit=cover so the canvas can reach under the notch. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f3742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Walk your plushie around a three-room house and rearrange the furniture.">

<style>
  :root {
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left, 0px);
    --safe-right:  env(safe-area-inset-right, 0px);
    --stick-size:  132px;
    --knob-size:   58px;
    --action-size: 88px;
    --ui: rgba(255, 255, 255, 0.9);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2f3742;
    /* Stop iOS from interpreting drags as scroll or pinch-zoom. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    /* inset:0 alone leaves gaps under the notch on some phones. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             var(--safe-bottom) env(safe-area-inset-left);
    display: block;
  }

  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- Joystick ---------- */

  #joystick {
    position: fixed;
    /* Centred horizontally, so both thumbs rest on it in portrait. */
    left: 50%;
    transform: translateX(-50%);
    bottom: max(12px, calc(var(--safe-bottom) + 14px));
    /* Shrink on narrow viewports so the stick and the action button always
       have room side by side. */
    width: min(var(--stick-size), 36vw);
    height: min(var(--stick-size), 36vw);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    touch-action: none;
  }

  /* Faint arrows so the stick reads as directional before you touch it. */
  #joystick::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      linear-gradient(to top,    rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 2px 34% no-repeat,
      linear-gradient(to bottom, rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 2px 34% no-repeat,
      linear-gradient(to left,   rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 34% 2px no-repeat,
      linear-gradient(to right,  rgba(255,255,255,0.30), rgba(255,255,255,0) 46%) center / 34% 2px no-repeat;
    opacity: 0.55;
  }

  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    /* Scales with the housing so it keeps a usable amount of travel on small
       screens, instead of eating most of a shrunk stick. */
    width: min(var(--knob-size), 44%);
    height: min(var(--knob-size), 44%);
    margin-left: calc(min(var(--knob-size), 44%) / -2);
    margin-top: calc(min(var(--knob-size), 44%) / -2);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    /* The JS writes translate(x, y) on this, so the knob offsets are composed
       here rather than replaced. Do not set `transform` outright. */
    will-change: transform;
    pointer-events: none;
  }

  /* ---------- Menu ---------- */

  /* Top-right so it cannot collide with the stick (bottom-centre) or the action
     and rotate buttons (bottom-right). */
  #menu-button {
    position: fixed;
    top: max(10px, calc(env(safe-area-inset-top) + 10px));
    right: max(10px, calc(env(safe-area-inset-right) + 10px));
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.32);
    background: rgba(47, 55, 66, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    z-index: 15;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 140ms ease, transform 140ms ease;
  }

  #menu-button:active { transform: scale(0.94); }
  #menu-button svg { width: 24px; height: 24px; }

  #menu-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    background: rgba(0, 0, 0, 0.42);
    z-index: 16;
  }

  #menu-backdrop.open { display: block; }

  #menu {
    position: fixed;
    top: max(10px, calc(env(safe-area-inset-top) + 10px));
    right: max(10px, calc(env(safe-area-inset-right) + 10px));
    width: min(300px, calc(100vw - 24px));
    /* Anchored to the button's left edge and nudged up by its own half-height,
       so the sheet appears to grow out from under the button. */
    transform-origin: top right;
    transform: scale(0.9);
    opacity: 0;
    pointer-events: none;
    /* 180ms matches the button's own transition. */
    transition: transform 180ms cubic-bezier(0.2, 0.8, 0.3, 1), opacity 140ms ease;
    background: #2f3742;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
    color: var(--ui);
    z-index: 17;
    overflow: hidden;
  }

  /* Below the button's height, so the sheet clears it instead of covering it. */
  #menu.open {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
    margin-top: 54px;
  }

  #menu header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  #menu header strong {
    display: block;
    font-size: 15px;
    letter-spacing: 0.2px;
  }

  #menu header span {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
  }

  #menu ul {
    list-style: none;
    margin: 0;
    padding: 6px;
  }

  #menu .row { padding: 2px; }

  #menu .row[hidden] { display: none; }

  #menu button {
    display: block;
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ui);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease;
  }

  #menu button:active:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

  #menu button:disabled {
    opacity: 0.75;
    cursor: default;
  }

  #menu button[hidden] { display: none; }

  #menu .note {
    padding: 0 14px 10px;
    font-size: 11.5px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.5);
  }

  #menu .note[hidden] { display: none; }

  #menu .meta {
    padding: 10px 16px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 11px;
    color: rgba(255, 255, 255, 0.42);
  }

  /* ---------- Action button ---------- */

  /* Sits to the right of the bottom-centre stick. Inert (but still present)
     until an interactable is in range, so the layout does not jump.

     The insets are max()-clamped against a small floor so the button can never
     be pushed off-screen or under the notch on a device with a large safe
     area, which is what previously cut it off. */
  #action {
    position: fixed;
    right: max(12px, calc(var(--safe-right) + 12px));
    bottom: max(12px, calc(var(--safe-bottom) + 14px));
    /* 26vw with a 36vw stick leaves a clear gap at every width down to 260px,
       verified from 260 to 480. */
    width: min(var(--action-size), 26vw);
    height: min(var(--action-size), 26vw);
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 11;
    touch-action: none;
    cursor: pointer;
    transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* A speech-bubble glyph, drawn with borders so it needs no icon font. */
  #action::before {
    content: "";
    position: relative;
    width: 34px;
    height: 26px;
    border: 3px solid currentColor;
    border-radius: 9px;
  }

  #action::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 22px;
    width: 9px;
    height: 9px;
    border-right: 3px solid currentColor;
    border-bottom: 3px solid currentColor;
    background: inherit;
    transform: translateX(-70%) rotate(45deg);
  }

  /* Nothing in range: visible but clearly disabled. */
  #action[disabled] {
    opacity: 0.28;
    cursor: default;
  }

  /* In range and pressed. */
  #action:not([disabled]):active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.34);
  }

  /* Carrying: the bubble glyph becomes a place-down arrow, so the button says
     what the next press will do instead of relying on the prompt alone. */
  #action.carrying::before {
    width: 26px;
    height: 26px;
    border: none;
    border-right: 4px solid currentColor;
    border-bottom: 4px solid currentColor;
    border-radius: 2px;
    transform: rotate(45deg) translate(-3px, -3px);
  }

  #action.carrying::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 20px;
    width: 28px;
    height: 4px;
    border: none;
    border-radius: 2px;
    background: currentColor;
    transform: translateX(-50%);
  }

  /* ---------- Farming action glyph ---------- */

  /* On the farm the hand glyph yields to a real SVG of whichever tool is
     loaded. js/farm/hud.js writes the SVG; this just switches which layer the
     button shows. */
  #action-glyph {
    display: none;
    width: 34px;
    height: 34px;
  }

  #action-glyph svg {
    width: 34px;
    height: 34px;
  }

  #action.farming::before,
  #action.farming::after {
    display: none;
  }

  #action.farming #action-glyph {
    display: block;
  }

  /* Refusal: the button lurches sideways once, so a no-op press lands with a
     thunk instead of doing nothing silently. */
  @keyframes action-warn {
    0%, 100% { transform: translateX(0); }
    30%      { transform: translateX(-3px); }
    60%      { transform: translateX(3px); }
  }

  #action.warn {
    animation: action-warn 180ms ease;
  }

  /* ---------- Rotate button ---------- */

  /* Only exists while something is being carried. Stacks directly above the
     action button on the same right inset, so the bottom row never shifts and
     nothing new appears on screen when the player is only walking around. */
  #rotate {
    position: fixed;
    right: max(12px, calc(var(--safe-right) + 12px));
    bottom: max(12px, calc(var(--safe-bottom) + 14px));
    /* Ride on top of the action button, whichever of the two is smaller. */
    margin-bottom: calc(min(var(--action-size), 26vw) + 14px);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 11;
    touch-action: none;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
    transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #rotate svg {
    width: 30px;
    height: 30px;
  }

  #rotate.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  #rotate.visible:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.34);
  }

  /* ---------- Farm HUD: wallet, tools, hint ---------- */

  /* The whole cluster is hidden on the house by the same pattern the rotate
     button uses - opacity plus pointer-events - so none of it ever flashes
     while walking indoors. Shown together by js/farm/hud.js. */

  /* Wallet: two chips in the top-left, seeds you can spend and wheat you have
     banked. The clue to the whole loop lives in that pair of numbers. */
  #wallet {
    position: fixed;
    top: max(12px, calc(env(safe-area-inset-top, 0px) + 10px));
    left: max(12px, calc(var(--safe-left) + 12px));
    display: flex;
    gap: 8px;
    z-index: 16;
    opacity: 0;
    transform: translateY(-8px);
    visibility: hidden;
    pointer-events: none;
    transition: opacity 140ms ease, transform 140ms ease;
  }

  #wallet.visible {
    opacity: 1;
    transform: none;
    visibility: visible;
  }

  #wallet .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(17, 24, 32, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--ui);
    font-size: 13px;
  }

  #wallet .chip svg { width: 16px; height: 16px; flex: none; }
  #wallet .chip b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #wallet .chip.coins svg { color: #ffd77a; }
  #wallet.empty .chip { opacity: 0.45; }

  /* Tool rail: the four moves of the loop, docked into one glass tube above
     the action button. Both live under the right thumb, the hand that presses
     Action, so a tool swap is a nudge instead of a reach across the screen;
     the left thumb stays parked on the stick. */
  #tool-rail {
    position: fixed;
    right: max(12px, calc(var(--safe-right) + 12px));
    bottom: max(12px, calc(var(--safe-bottom) + 14px));
    /* Ride on top of the action button, the same clearance the rotate button
       uses so the two swap cleanly when a carry starts. */
    margin-bottom: calc(min(var(--action-size), 26vw) + 14px);
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(17, 24, 32, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 16;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(10px);
    transition: opacity 140ms ease, transform 140ms ease;
  }

  #tool-rail.visible {
    opacity: 1;
    transform: none;
    visibility: visible;
    pointer-events: auto;
  }

  /* Carrying: the rail steps out of the way so the rotate button can own the
     corner. */
  #tool-rail.fading {
    opacity: 0;
    transform: translateX(10px);
    pointer-events: none;
  }

  #tool-rail .tool {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    background: transparent;
    color: var(--ui);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
  }

  #tool-rail .tool svg { width: 26px; height: 26px; }

  #tool-rail .tool:active {
    transform: scale(0.9);
    background: rgba(255, 255, 255, 0.18);
  }

  /* The loaded tool: a warm gold seat so it reads at a glance which move a
     plot tap is about to make. */
  #tool-rail .tool.selected {
    background: rgba(255, 213, 138, 0.14);
    border-color: rgba(255, 200, 90, 0.9);
    color: #ffe2ae;
    box-shadow: inset 0 0 12px rgba(255, 190, 80, 0.28);
  }

  /* The tool that would currently work breathes a soft gold halo, teaching
     the loop instead of expecting it to be memorised. */
  #tool-rail .tool.ready:not(.selected) {
    border-color: rgba(255, 200, 90, 0.5);
    animation: ready-pulse 1.6s ease-in-out infinite;
  }

  @keyframes ready-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 90, 0); }
    50%      { box-shadow: 0 0 0 4px rgba(255, 200, 90, 0.18); }
  }

  /* Wear: a life gauge under the icon, filled from the left. Full when new,
     gone when it breaks, and a reddish tint while it is on its last actions. */
  #tool-rail .tool .wear {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 6px;
    height: 3px;
    border-radius: 3px;
    background: rgba(140, 208, 255, 0.7);
    transform-origin: left center;
    transform: scaleX(0);
    pointer-events: none;
  }

  #tool-rail .tool.worn .wear { background: rgba(255, 120, 105, 0.8); }

  /* Not owned yet (a watering can you have not bought): dimmed and barred. */
  #tool-rail .tool.locked {
    opacity: 0.38;
    border-style: dashed;
  }

  #tool-rail .tool.locked .wear { display: none; }

  /* Hint: one line above the stick saying what the next press will do. Also
     the place the no-op reason lands ("Already wet", "Out of seeds"...). */
  #tool-hint {
    position: fixed;
    left: 50%;
    bottom: max(
      calc(var(--safe-bottom) + 14px),
      calc(min(var(--stick-size), 36vw) + 22px)
    );
    transform: translateX(-50%) translateY(6px);
    z-index: 16;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(17, 24, 32, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.85);
    font-size: 12.5px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 140ms ease, transform 140ms ease;
  }

  #tool-hint.visible {
    opacity: 1;
    transform: translateX(-50%);
  }

  /* ---------- Destinations ---------- */

  /* Full-screen scrim with a sheet of places, opened by using a door. Like the
     menu, it is faded and un-tappable rather than display:none, because display
     would kill the open transition. Sits above the HUD (10-17) and below the
     loading and error overlays (20+). */
  #destinations {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.48);
    opacity: 0;
    /* Hidden, not just transparent: a transparent sheet would still take the
       tab order and reach screen readers behind aria-hidden. */
    visibility: hidden;
    pointer-events: none;
    transition: opacity 160ms ease, visibility 0s linear 160ms;
    z-index: 19;
  }

  #destinations.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 160ms ease, visibility 0s;
  }

  .dest-sheet {
    width: min(430px, calc(100vw - 32px));
    background: #2f3742;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55);
    color: var(--ui);
    overflow: hidden;
    transform: translateY(12px) scale(0.97);
    transition: transform 180ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  #destinations.open .dest-sheet { transform: none; }

  .dest-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 12px 12px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .dest-head h2 { font-size: 16px; font-weight: 650; letter-spacing: 0.2px; }

  #dest-close {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ui);
    font: inherit;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease;
  }

  #dest-close:active { background: rgba(255, 255, 255, 0.16); }

  #dest-cards {
    display: grid;
    gap: 10px;
    padding: 14px;
  }

  .dest-card {
    display: grid;
    grid-template-columns: 52px 1fr;
    grid-template-rows: auto auto;
    column-gap: 14px;
    align-items: center;
    text-align: left;
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--ui);
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
  }

  .dest-card:active {
    transform: scale(0.985);
    background: rgba(255, 255, 255, 0.14);
  }

  .dest-card[hidden] { display: none; }

  .dest-icon {
    grid-row: 1 / span 2;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
  }

  .dest-icon svg { width: 30px; height: 30px; }

  .dest-title { font-size: 15px; font-weight: 600; }

  .dest-blurb {
    margin-top: 2px;
    font-size: 12.5px;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.55);
  }

  /* ---------- Market stall ---------- */

  /* Same sheet, same tap-to-dismiss pattern as the destination picker; the
     rows list what the stall will trade for coins. */
  #shop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.48);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 160ms ease, visibility 0s linear 160ms;
    z-index: 19;
  }

  #shop.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 160ms ease, visibility 0s;
  }

  #shop.open .dest-sheet { transform: none; }

  #shop-close {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ui);
    font: inherit;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease;
  }

  #shop-close:active { background: rgba(255, 255, 255, 0.16); }

  .shop-balance {
    padding: 12px 18px 0;
    font-size: 12.5px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.55);
  }

  #shop-list {
    display: grid;
    gap: 10px;
    padding: 14px;
  }

  .shop-row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    column-gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
  }

  .shop-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.1);
  }

  .shop-icon svg { width: 26px; height: 26px; }

  .shop-name { font-size: 14px; font-weight: 600; }

  .shop-meta {
    margin-top: 1px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
  }

  .shop-action {
    min-width: 64px;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 200, 90, 0.16);
    color: #ffd77a;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease, transform 140ms ease;
  }

  .shop-action:active { transform: scale(0.95); }

  .shop-action[disabled] {
    opacity: 0.4;
    cursor: default;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.45);
  }

  /* ---------- Travel fade ---------- */

  /* Covers the HUD as well as the canvas, so the world swap happens behind a
     solid panel instead of popping. Equal layer to the sheet but later in the
     document, so it paints over anything left on screen. */
  #travel-fade {
    position: fixed;
    inset: 0;
    background: #2f3742;
    opacity: 0;
    pointer-events: none;
    transition: opacity 260ms ease;
    z-index: 19;
  }

  #travel-fade.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- Overlays ---------- */

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #2f3742;
    color: var(--ui);
    z-index: 20;
    text-align: center;
    padding: 24px;
  }

  #loading .bar {
    width: 170px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }

  #loading .bar span {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: #e0b070;
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  #loading.hidden { display: none; }

  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px;
    background: #2f3742;
    color: #ffb4a2;
    z-index: 30;
    text-align: center;
  }

  #error code {
    display: block;
    max-width: 90vw;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    color: #ffd9cf;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
    text-align: left;
  }

  /* Nudge for orientation when the phone is held sideways.
     Note the id: this must NOT be "rotate", which belongs to the carry
     rotation button. Sharing it let this rule's display:none and inset:0
     apply to the button as well and the button never rendered at all. */
  #turn-hint {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-direction: column;
    background: #2f3742;
    color: var(--ui);
    z-index: 40;
    text-align: center;
    padding: 24px;
  }

  #turn-hint .icon {
    width: 46px;
    height: 74px;
    border: 3px solid var(--ui);
    border-radius: 9px;
    animation: turn 2.4s ease-in-out infinite;
  }

  @keyframes turn {
    0%, 40%   { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }

  /* Portrait phones only: show the hint, but keep it cheap. */
  @media (orientation: landscape) and (max-height: 520px) {
    #turn-hint { display: flex; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>

<body>
  <div id="stage"></div>

  <div id="joystick" aria-hidden="true">
    <div id="knob"></div>
  </div>

  <button id="menu-button" type="button" aria-label="Open menu"
          aria-haspopup="true" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <path d="M3.5 7h17M3.5 12h17M3.5 17h17" />
    </svg>
  </button>

  <div id="menu-backdrop"></div>

  <nav id="menu" aria-label="Menu">
    <header>
      <strong>Plushie Walk</strong>
      <span>Rearrange the house</span>
    </header>
    <ul>
      <li class="row" id="install-row" hidden>
        <button id="install" type="button">Install</button>
        <div class="note" id="install-note" hidden></div>
      </li>
    </ul>
    <div class="meta">Move with the stick. Drag the view to rotate it.</div>
  </nav>

  <button id="action" type="button" aria-label="Interact" disabled>
    <span id="action-glyph" aria-hidden="true"></span>
  </button>

  <button id="rotate" type="button" aria-label="Rotate carried object 90 degrees">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-2.34-5.66" />
      <path d="M18.6 2.6v4.2h-4.2" />
    </svg>
  </button>

  <!-- Farm HUD (js/farm/hud.js). Hidden on the house; shown on the farm.

       The wallet is the whole economy in two numbers: what you can sow, and
       what you have banked. The tool rail buttons are injected from TOOLS in
       js/farm/items.js. -->
  <div id="wallet" aria-hidden="true">
    <div class="chip coins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.6" />
        <path d="M10.7 15.6v-7.2" />
        <path d="M10.7 9.5h2.4a1.8 1.8 0 0 1 0 3.6h-2.4" />
      </svg>
      <b id="wallet-coins">0</b>
    </div>
    <div class="chip seeds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9.5 12 6l6 3.5v9L12 22l-6-3.5Z" />
        <path d="M6 9.5 12 13l6-3.5" />
        <path d="M12 13v9" />
      </svg>
      <b id="wallet-seeds">0</b>
    </div>
    <div class="chip wheat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21v-7" />
        <path d="M12 14c0-3.3 2.7-6 6-6 0 3.3-2.7 6-6 6Z" />
        <path d="M12 16c-3.3 0-6-2.4-6-5.6 3.3 0 6 2.4 6 5.6Z" />
      </svg>
      <b id="wallet-wheat">0</b>
    </div>
  </div>

  <div id="tool-rail" role="group" aria-label="Farm tools" aria-hidden="true"></div>

  <div id="tool-hint" role="status" aria-live="polite"></div>

  <div id="destinations" role="dialog" aria-modal="true" aria-labelledby="dest-title">
    <div class="dest-sheet">
      <div class="dest-head">
        <h2 id="dest-title">Where to?</h2>
        <button id="dest-close" type="button" aria-label="Close">&times;</button>
      </div>
      <!-- Cards are built from DESTINATIONS in js/portal.js. -->
      <div id="dest-cards"></div>
    </div>
  </div>

  <div id="shop" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <div class="dest-sheet">
      <div class="dest-head">
        <h2 id="shop-title">Market stall</h2>
        <button id="shop-close" type="button" aria-label="Close">&times;</button>
      </div>
      <!-- Rows are built by the farm world from the catalogue in js/farm/items.js. -->
      <div class="shop-balance">Buy seeds and tools, or sell the wheat you bring back.</div>
      <div id="shop-list"></div>
    </div>
  </div>

  <div id="travel-fade"></div>

  <div id="loading">
    <div>Waking up the plushie&hellip;</div>
    <div class="bar"><span></span></div>
  </div>

  <div id="error">
    <strong>Something broke</strong>
    <code id="error-text"></code>
  </div>

  <div id="turn-hint">
    <div class="icon"></div>
    <div>Turn your phone upright</div>
  </div>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
